<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Cabeçalho -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"></path>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <div>
                    <h1>TaskFlow</h1>
                    <p class="subtitle">Organize suas tarefas com eficiência</p>
                </div>
            </div>

            <div class="header-actions">
                <button id="themeToggleBtn" class="icon-btn" title="Alternar Tema Claro/Escuro" aria-label="Alternar Tema">
                    <svg id="themeIconSun" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="themeIconMoon" class="theme-icon hidden" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Dashboard de Métricas -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Total de Tarefas</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
                <div class="stat-icon icon-total">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Pendentes</span>
                    <span class="stat-value" id="statPending">0</span>
                </div>
                <div class="stat-icon icon-pending">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Concluídas</span>
                    <span class="stat-value" id="statCompleted">0</span>
                </div>
                <div class="stat-icon icon-completed">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Atrasadas</span>
                    <span class="stat-value" id="statOverdue">0</span>
                </div>
                <div class="stat-icon icon-overdue">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
            </div>
        </section>

        <!-- Barra de Progresso Geral -->
        <div class="progress-section">
            <div class="progress-header">
                <span>Progresso Geral</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Formulário de Nova Tarefa -->
        <section class="task-form-card">
            <form id="createTaskForm">
                <div class="main-input-row">
                    <div class="input-with-icon">
                        <svg class="field-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <input type="text" id="taskTitle" name="title" placeholder="O que você precisa fazer?" required autocomplete="off">
                    </div>
                    <button type="button" id="toggleDetailsBtn" class="secondary-btn" title="Mais opções">
                        <span>Detalhes</span>
                        <svg id="toggleDetailsIcon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <button type="submit" class="primary-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>Adicionar</span>
                    </button>
                </div>

                <!-- Detalhes Expansíveis -->
                <div id="formDetails" class="form-details collapsed">
                    <div class="form-row">
                        <div class="form-group flex-2">
                            <label for="taskDesc">Descrição (opcional)</label>
                            <textarea id="taskDesc" name="description" rows="2" placeholder="Adicione notas, links ou detalhes importantes..."></textarea>
                        </div>
                    </div>

                    <div class="form-row three-cols">
                        <div class="form-group">
                            <label for="taskCategory">Categoria</label>
                            <input list="categoryList" id="taskCategory" name="category" placeholder="Ex: Trabalho, Estudos" value="Geral">
                            <datalist id="categoryList">
                                <option value="Geral">
                                <option value="Trabalho">
                                <option value="Estudos">
                                <option value="Pessoal">
                                <option value="Finanças">
                                <option value="Saúde">
                            </datalist>
                        </div>

                        <div class="form-group">
                            <label for="taskPriority">Prioridade</label>
                            <select id="taskPriority" name="priority">
                                <option value="Baixa">🟢 Baixa</option>
                                <option value="Média" selected>🟡 Média</option>
                                <option value="Alta">🔴 Alta</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="taskDueDate">Data de Entrega</label>
                            <input type="date" id="taskDueDate" name="due_date">
                        </div>
                    </div>
                </div>
            </form>
        </section>

        <!-- Barra de Ferramentas (Filtros, Busca e Ordenação) -->
        <section class="toolbar">
            <!-- Abas de Status -->
            <div class="status-tabs">
                <button class="tab-btn active" data-status="all">Todas</button>
                <button class="tab-btn" data-status="pending">Pendentes</button>
                <button class="tab-btn" data-status="completed">Concluídas</button>
            </div>

            <!-- Busca e Filtros Avançados -->
            <div class="filters-wrap">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Pesquisar tarefas...">
                    <button type="button" id="clearSearchBtn" class="clear-btn hidden">&times;</button>
                </div>

                <div class="select-filters">
                    <select id="categoryFilter" title="Filtrar por Categoria">
                        <option value="todas">Todas as Categorias</option>
                    </select>

                    <select id="priorityFilter" title="Filtrar por Prioridade">
                        <option value="todas">Todas as Prioridades</option>
                        <option value="Alta">🔴 Alta</option>
                        <option value="Média">🟡 Média</option>
                        <option value="Baixa">🟢 Baixa</option>
                    </select>

                    <select id="sortFilter" title="Ordenar por">
                        <option value="created_desc">Mais Recentes</option>
                        <option value="created_asc">Mais Antigas</option>
                        <option value="due_date">Data de Vencimento</option>
                        <option value="priority">Prioridade (Alta primeiro)</option>
                        <option value="title">Alfabética (A-Z)</option>
                    </select>
                </div>
            </div>

            <div class="toolbar-actions">
                <button id="clearCompletedBtn" class="danger-btn outline">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>Limpar Concluídas</span>
                </button>
            </div>
        </section>

        <!-- Lista de Tarefas -->
        <main class="tasks-container">
            <div id="tasksList" class="tasks-list">
                <!-- Preenchido via JavaScript -->
            </div>

            <!-- Estado Vazio -->
            <div id="emptyState" class="empty-state hidden">
                <div class="empty-state-icon">
                    <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 12h8"></path>
                        <path d="M12 8v8"></path>
                    </svg>
                </div>
                <h3>Nenhuma tarefa encontrada</h3>
                <p>Crie uma nova tarefa acima para começar seu dia produtivo!</p>
            </div>
        </main>
    </div>

    <!-- Modal de Edição de Tarefa -->
    <div id="editModal" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Editar Tarefa</h2>
                <button type="button" id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <form id="editTaskForm">
                <input type="hidden" id="editTaskId">
                
                <div class="form-group">
                    <label for="editTaskTitle">Título da Tarefa *</label>
                    <input type="text" id="editTaskTitle" required>
                </div>

                <div class="form-group">
                    <label for="editTaskDesc">Descrição</label>
                    <textarea id="editTaskDesc" rows="3"></textarea>
                </div>

                <div class="form-row three-cols">
                    <div class="form-group">
                        <label for="editTaskCategory">Categoria</label>
                        <input list="categoryList" id="editTaskCategory">
                    </div>

                    <div class="form-group">
                        <label for="editTaskPriority">Prioridade</label>
                        <select id="editTaskPriority">
                            <option value="Baixa">🟢 Baixa</option>
                            <option value="Média">🟡 Média</option>
                            <option value="Alta">🔴 Alta</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="editTaskDueDate">Data de Entrega</label>
                        <input type="date" id="editTaskDueDate">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="cancelEditBtn" class="secondary-btn">Cancelar</button>
                    <button type="submit" class="primary-btn">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
