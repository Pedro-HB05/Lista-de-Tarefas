name: Build e Deploy no Azure com Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login no GitHub Container Registry (automático via GITHUB_TOKEN)
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Login no Docker Hub (opcional, caso tenha configurado as secrets DOCKERHUB_USERNAME e DOCKERHUB_TOKEN)
      - name: Login no Docker Hub (opcional)
        if: "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Define as tags das imagens
      - name: Definir tags da imagem
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="ghcr.io/${REPO_LOWER}:latest"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/minha-app:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      # Compila a imagem Docker e envia para o(s) registro(s)
      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # Dispara o Webhook do Azure para recarregar o contêiner (se configurado)
      - name: Notificar Azure App Service via Webhook
        if: "${{ secrets.AZURE_WEBHOOK_URL != '' }}"
        run: |
          echo "Disparando atualização do contêiner no Azure App Service..."
          curl -s -S -X POST "${{ secrets.AZURE_WEBHOOK_URL }}"

      # Deploy no Azure App Service via Publish Profile (se configurado)
      - name: Deploy no Azure Web App
        if: "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}"
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'webapp-aula123'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/minha-app:latest', secrets.DOCKERHUB_USERNAME) || format('ghcr.io/{0}:latest', github.repository) }}
